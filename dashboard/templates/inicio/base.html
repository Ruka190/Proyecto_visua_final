{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Beyond Date{% endblock %}</title>

    <!-- Estilos generales de la landing -->
    <link rel="stylesheet" href="{% static 'inicio/css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'inicio/css/typography.css' %}">

    <style>
        html {
            scroll-behavior: smooth;
        }

        /* Estilos base de cabecera y pie */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #FFFDFB;
            color: #4a4a4a;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 48px;
            background-color: rgba(255, 253, 249, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #F3CFC4;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand__logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .brand__name {
            font-size: 20px;
            font-weight: 700;
            color: #4a4a4a;
        }

        .main-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* Botón estilizado de Iniciar Sesión a la derecha */
        .btn-header-login {
            text-decoration: none;
            background-color: #E87265;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 24px;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(232, 114, 101, 0.25);
            transition: all 0.2s ease;
        }

        .btn-header-login:hover {
            background-color: #d85b53;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(232, 114, 101, 0.35);
        }

        .site-footer {
            padding: 40px 48px;
            background-color: #FBE7E0;
            border-top: 1px solid #F3CFC4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .site-footer__nav {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .site-footer__nav a {
            text-decoration: none;
            color: #5c5c5c;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .site-footer__nav a:hover {
            color: #A63A32;
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .site-header {
                padding: 14px 20px;
            }
            .site-footer {
                padding: 24px;
                flex-direction: column;
                text-align: center;
            }
            .site-footer__nav {
                justify-content: center;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- ================= Cabecera ================= -->
    <header class="site-header">
        <a class="brand" href="{% url 'index' %}#inicio">
            <img class="brand__logo" src="{% static 'inicio/img/icono.png' %}" alt="Logo Beyond Date">
            <span class="brand__name">Beyond Date</span>
        </a>

        <nav class="main-nav">
            <a href="{% url 'login_view' %}" class="btn-header-login">Iniciar Sesión</a>
        </nav>
    </header>

    <!-- Contenido principal de cada página -->
    {% block content %}{% endblock %}

    <!-- ================= Pie de página ================= -->
    <footer class="site-footer">
        <a class="brand" href="{% url 'index' %}#inicio">
            <img class="brand__logo" src="{% static 'inicio/img/icono.png' %}" alt="Logo Beyond Date">
            <span class="brand__name">Beyond Date</span>
        </a>
        <nav class="site-footer__nav">
            <a href="{% url 'index' %}#inicio">Inicio</a>
            <a href="{% url 'index' %}#mision">Nuestra Misión</a>
            <a href="{% url 'index' %}#faq">FAQ</a>
            <a href="{% url 'index' %}#contacto">Contacto</a>
        </nav>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
