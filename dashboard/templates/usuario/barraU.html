{% load static %}
<!-- Iconos de Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
    /* =========================================
       Navegación Móvil (Barra Inferior Flotante)
       ========================================= */
    .app-sidebar {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 480px; 
        background-color: rgba(247, 225, 215, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 40px; 
        border: 1.5px solid #e0c8be;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        z-index: 1050;
        padding: 0.5rem 1rem;
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-direction: row;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item-circle {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 50%;
        border: 2px solid #222222;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #222222 !important; 
        font-size: 1.2rem;
        background-color: transparent;
        transition: all 0.2s ease;
        position: relative;
    }

    .nav-item-circle:hover { 
        background-color: rgba(232, 114, 101, 0.15);
        transform: translateY(-2px);
    }
    
    .nav-item-circle.active {
        background-color: #E87265;
        border-color: #c05245;
        color: #ffffff !important;
        box-shadow: 0 4px 12px rgba(232, 114, 101, 0.4);
    }

    .avatar-circle { padding: 0; overflow: hidden; border-color: #7b2c3a; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Textos y elementos exclusivos de Desktop */
    .nav-item-text { display: none; }
    .sidebar-header-box { display: none; }
    .sidebar-toggle-btn { display: none; }

    /* =========================================
       Navegación Desktop (Menú Lateral Izquierdo)
       ========================================= */
    @media (min-width: 992px) {
        body {
            padding-left: 280px !important;
            padding-bottom: 0 !important;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-sidebar {
            bottom: 0;
            left: 0;
            top: 0;
            transform: none;
            width: 280px;
            max-width: 280px;
            height: 100vh;
            border-radius: 0;
            border: none;
            border-right: 1px solid #ead5cc;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 2rem 1.2rem;
            background-color: #FFFDFB;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.03);
        }

        /* Cabecera del Sidebar con Logo y Botón Ocultar */
        .sidebar-header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #4a4a4a;
            text-decoration: none;
        }

        .sidebar-logo img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* Botón para colapsar/ocultar el menú */
        .sidebar-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #ead5cc;
            background-color: #F8F7F2;
            color: #6b6b6b;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-toggle-btn:hover {
            background-color: #E87265;
            color: #ffffff;
            border-color: #E87265;
        }

        /* Estilo de los botones en el Sidebar expandido */
        .nav-item-circle {
            width: 100%;
            height: 48px;
            border-radius: 14px;
            border: none;
            justify-content: flex-start;
            padding: 0 16px;
            margin-bottom: 0.6rem;
            font-weight: 500;
            color: #5c5c5c !important;
            background-color: transparent;
        }

        .nav-item-circle:hover {
            background-color: #F8F7F2;
            color: #E87265 !important;
            transform: none;
        }

        .nav-item-circle i {
            font-size: 1.3rem;
            margin-right: 14px;
            min-width: 24px;
            text-align: center;
        }

        .nav-item-circle.active {
            background-color: #FDECE7 !important;
            border-left: 4px solid #E87265;
            border-radius: 0 14px 14px 0;
            color: #A63A32 !important;
            font-weight: 600;
            box-shadow: none;
        }

        .nav-item-text {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .avatar-circle {
            border-radius: 14px !important;
            border: none !important;
            padding: 0 12px !important;
            height: 52px !important;
        }
        
        .avatar-circle img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 12px;
            border: 2px solid #E87265;
        }

        .sidebar-nav-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .avatar-container {
            margin-top: auto;
            border-top: 1px solid #f0e2dd;
            padding-top: 1rem;
            border-radius: 0 !important;
        }

        /* =========================================
           ESTADO COLAPSADO (Cuando el usuario oculta el menú)
           ========================================= */
        body.sidebar-collapsed {
            padding-left: 90px !important;
        }

        body.sidebar-collapsed .app-sidebar {
            width: 88px;
            padding: 2rem 0.8rem;
        }

        body.sidebar-collapsed .sidebar-logo span,
        body.sidebar-collapsed .nav-item-text {
            display: none !important;
        }

        body.sidebar-collapsed .sidebar-header-box {
            flex-direction: column;
            gap: 15px;
            margin-bottom: 2rem;
        }

        body.sidebar-collapsed .nav-item-circle {
            justify-content: center;
            padding: 0;
            height: 48px;
            border-radius: 50%;
            margin-bottom: 0.8rem;
        }

        body.sidebar-collapsed .nav-item-circle i {
            margin-right: 0;
            font-size: 1.4rem;
        }

        body.sidebar-collapsed .nav-item-circle.active {
            border-left: none;
            border-radius: 50%;
            background-color: #E87265 !important;
            color: #ffffff !important;
        }

        body.sidebar-collapsed .avatar-circle img {
            margin-right: 0;
            width: 38px;
            height: 38px;
        }

        body.sidebar-collapsed .avatar-container {
            padding-top: 0.5rem;
            border-top: none;
        }
    }
</style>

<nav class="app-sidebar shadow-sm" id="mainSidebar">
    
    <!-- Cabecera del Menú Lateral (Desktop) -->
    <div class="sidebar-header-box">
        <a href="{% url 'inicioU' %}" class="sidebar-logo">
            <img src="{% static 'inicio/img/icono.png' %}" alt="Logo Beyond Date">
            <span>Beyond Date</span>
        </a>
        <!-- Botón interactivo para colapsar/expandir -->
        <button type="button" class="sidebar-toggle-btn" id="toggleSidebarBtn" title="Ocultar / Mostrar menú">
            <i class="bi bi-chevron-left" id="toggleIcon"></i>
        </button>
    </div>

    <!-- Contenedor de enlaces -->
    <div class="sidebar-nav-container w-100 d-flex justify-content-around align-items-center flex-lg-column">
        
        <!-- Inicio -->
        <a href="{% url 'inicioU' %}" class="nav-item-circle {% if request.resolver_match.url_name == 'inicioU' %}active{% endif %}" title="Inicio">
            <i class="bi bi-house-door"></i>
            <span class="nav-item-text">Inicio</span>
        </a>

        <!-- Buscador (Icono de Lupa actualizado) -->
        <a href="{% url 'buscadorU' %}" class="nav-item-circle {% if request.resolver_match.url_name == 'buscadorU' %}active{% endif %}" title="Buscador">
            <i class="bi bi-search"></i>
            <span class="nav-item-text">Buscador</span>
        </a>

        <!-- Mensajes -->
        <a href="{% url 'mensajesU' %}" class="nav-item-circle {% if request.resolver_match.url_name == 'mensajesU' %}active{% endif %}" title="Mensajes">
            <i class="bi bi-chat-heart"></i>
            <span class="nav-item-text">Mensajes</span>
        </a>
        
        <!-- Notificaciones -->
        <a href="{% url 'notificacionesU' %}" class="nav-item-circle {% if request.resolver_match.url_name == 'notificacionesU' %}active{% endif %}" title="Notificaciones">
            <i class="bi bi-bell"></i>
            <span class="nav-item-text">Notificaciones</span>
        </a>

        <!-- Avatar / Perfil -->
        <a href="{% url 'perfilU' %}" class="nav-item-circle avatar-circle avatar-container {% if request.resolver_match.url_name == 'perfilU' %}active{% endif %}" title="Mi Perfil">
            <img src="{% static 'usuario/img/javier.jpg' %}" alt="Perfil">
            <span class="nav-item-text">Mi Perfil</span>
        </a>
    </div>
</nav>

<!-- Script para la interactividad de colapsar el menú -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('toggleSidebarBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        const body = document.body;

        // Recordar preferencia del usuario en la sesión si desea el menú oculto
        if (localStorage.getItem('sidebar_collapsed') === 'true') {
            body.classList.add('sidebar-collapsed');
            if(toggleIcon) toggleIcon.className = 'bi bi-chevron-right';
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                body.classList.toggle('sidebar-collapsed');
                const isCollapsed = body.classList.contains('sidebar-collapsed');
                
                // Cambiar icono de la flecha
                if (isCollapsed) {
                    toggleIcon.className = 'bi bi-chevron-right';
                    localStorage.setItem('sidebar_collapsed', 'true');
                } else {
                    toggleIcon.className = 'bi bi-chevron-left';
                    localStorage.setItem('sidebar_collapsed', 'false');
                }
            });
        }
    });
</script>
