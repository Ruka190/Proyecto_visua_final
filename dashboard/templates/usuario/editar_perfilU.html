{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil · Beyond Date</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #F8F7F2;
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
        }
        .edit-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }
        .edit-card {
            background-color: #FFFDFB;
            border: 1px solid #F3CFC4;
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(232, 114, 101, 0.06);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #5c5c5c;
            margin-bottom: 0.4rem;
        }
        .form-control, .form-select {
            background-color: #FAF6F2;
            border: 1.5px solid #E3B9AE;
            border-radius: 14px;
            padding: 11px 16px;
            font-size: 0.92rem;
            color: #4a4a4a;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            background-color: #FFFDFB;
            border-color: #E87265;
            box-shadow: 0 0 0 4px rgba(232, 114, 101, 0.15);
        }
        .btn-save-changes {
            background-color: #E87265;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(232, 114, 101, 0.3);
            transition: all 0.2s ease;
        }
        .btn-save-changes:hover {
            background-color: #d85b53;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(232, 114, 101, 0.4);
        }
        .btn-cancel {
            background-color: #FAF6F2;
            color: #6b6b6b;
            border: 1px solid #E3B9AE;
            border-radius: 999px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-cancel:hover {
            background-color: #f3e8e2;
            color: #4a4a4a;
        }
    </style>
</head>
<body class="p-0">

    {% include 'usuario/barraU.html' %}

    <main class="edit-container">
        <div class="edit-card">
            
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                <div>
                    <span class="badge bg-light text-danger border px-3 py-1 rounded-pill mb-1" style="font-size: 0.72rem;">CONFIGURACIÓN</span>
                    <h1 class="h4 fw-bold text-dark mb-0">Editar tu Perfil</h1>
                </div>
                <a href="javascript:history.back()" class="text-muted small text-decoration-none">
                    <i class="bi bi-x-lg fs-5"></i>
                </a>
            </div>

            <!-- Formulario conectado a AWS RDS por POST -->
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Biografía</label>
                    <textarea name="biografia" class="form-control" rows="3" placeholder="Cuéntanos un poco sobre ti...">{{ cliente.biografia }}</textarea>
                    <small class="text-muted" style="font-size: 0.75rem;">Máximo 200 caracteres alineados con tus valores y pasiones.</small>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ocupación / Profesión</label>
                        <input type="text" name="ocupacionlaboral" class="form-control" value="{{ cliente.ocupacionlaboral }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nacionalidad</label>
                        <input type="text" name="nacionalidad" class="form-control" value="{{ cliente.nacionalidad }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Orientación Sexual</label>
                    <select name="orientacionsexual" class="form-select">
                        <option value="Heterosexual" {% if cliente.orientacionsexual == 'Heterosexual' %}selected{% endif %}>Heterosexual</option>
                        <option value="Bisexual" {% if cliente.orientacionsexual == 'Bisexual' %}selected{% endif %}>Bisexual</option>
                        <option value="Homosexual" {% if cliente.orientacionsexual == 'Homosexual' %}selected{% endif %}>Homosexual</option>
                        <option value="Otro" {% if cliente.orientacionsexual == 'Otro' %}selected{% endif %}>Otro</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                    <a href="javascript:history.back()" class="btn-cancel">Cancelar</a>
                    <button type="submit" class="btn-save-changes">
                        <i class="bi bi-check2 me-1"></i> Guardar en AWS RDS
                    </button>
                </div>
            </form>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
